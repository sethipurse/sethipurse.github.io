<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow SETHI PURSE 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #000000, #1a1a1a);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .logo {
      width: 180px;
      margin: 20px 0;
      filter: drop-shadow(0 0 15px gold);
    }
    h1 {
      font-size: 1.8rem;
      color: #FFD700;
      margin: 10px 0;
    }
    p.cta {
      font-size: 1rem;
      margin-bottom: 20px;
      color: #FFBF00;
    }
    .qr-code {
      border: 5px solid #FFD700;
      border-radius: 20px;
      padding: 15px;
      background: #fff;
      margin: 20px 0;
      box-shadow: 0 0 20px #FFD700;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin: 20px 0;
      width: 80%;
      max-width: 300px;
    }
    .buttons a {
      text-decoration: none;
      color: #000;
      font-weight: 600;
      background: linear-gradient(135deg, #FFD700, #FFBF00);
      padding: 12px;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .buttons a:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(255,215,0,0.6);
    }
    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <img src="image.jpg" alt="SETHI PURSE Logo" class="logo">
  <h1>Follow SETHI PURSE 💖</h1>
  <p class="cta">Scan and connect with us on all social media!</p>
  <img src="sethipurse_master_qr.png" alt="QR Code" class="qr-code" width="220">
  <div class="buttons">
    <a href="https://wa.me/917986161633" target="_blank">WhatsApp</a>
    <a href="https://www.instagram.com/sethipurse" target="_blank">Instagram</a>
    <a href="https://www.facebook.com/sethipurse" target="_blank">Facebook</a>
    <a href="https://www.youtube.com/@sethipurse" target="_blank">YouTube</a>
  </div>
  <footer>© 2025 SETHI PURSE – Stay stylish with us 💖</footer>
</body>
</html>
